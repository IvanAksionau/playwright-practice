<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Items</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav>
      <a href="/items">Items</a>
      <a href="/watch">Player</a>
    </nav>
    <main>
      <h1>Items</h1>
      <button type="button" id="new-item">New item</button>
      <!-- Hidden, not removed, so the Save button exists after New item is clicked. -->
      <form id="create-form" hidden>
        <label>
          Name
          <input id="name" name="name" required />
        </label>
        <button type="submit">Save</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>Name</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script src="/items.js"></script>
  </body>
</html>
