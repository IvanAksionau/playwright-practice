<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <!-- Labels are the contract for getByLabel. Placeholder text is not a label. -->
      <form id="login-form">
        <label>
          Email
          <input name="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
      </form>
      <!-- hidden until a failure. An empty alert would match getByRole('alert') too early. -->
      <p id="error" role="alert" hidden></p>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
